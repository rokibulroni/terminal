<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f2" />
    <meta name="color-scheme" content="light dark" />
    <meta name="author" content="Rokibul Roni" />
    <meta name="generator" content="Terminal" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/png" href="/fav.png" />
    <link rel="apple-touch-icon" href="/fav.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="alternate" type="text/plain" title="llms.txt" href="/llms.txt" />
    <link rel="service-desc" type="application/json" href="/api/openapi.json" />

    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var m = localStorage.getItem('terminal-mode');
          var c = localStorage.getItem('terminal-color-theme');
          var dark = m ? m === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) d.classList.add('dark');
          d.setAttribute('data-theme', c === 'crimson' || c === 'forest' ? c : 'harvest');
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#18120e');
        } catch (e) {}
      })();
    </script>

    <!--seo-->
    <title data-seo>Terminal — Cybersecurity Command Reference</title>
    <meta data-seo name="description" content="Searchable, copy-ready command references for penetration testing, network analysis, forensics, cloud security and Linux administration — with explanations for every command." />
    <!--/seo-->
  </head>

  <body>
    <noscript>
      <p style="padding:1rem;font-family:system-ui">
        Terminal works best with JavaScript enabled. All content is also available as
        <a href="/llms.txt">plain text</a> and <a href="/api/v1/manifest.json">JSON</a>.
      </p>
    </noscript>
    <div id="root"><!--app--></div>
    <!--state-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
